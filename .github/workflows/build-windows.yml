# Gera o instalador do Windows sob demanda (Actions > Build Windows > Run workflow),
# sem release e sem updater. Serve para testar antes de criar uma tag.
name: Build Windows

on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compilar e empacotar
        shell: bash
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2 build --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: oxid-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
