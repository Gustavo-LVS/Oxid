[package]
name = "oxid-client-core"
description = "Lógica do cliente: conexão com a API/gateway, estado e voz."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
oxid-proto.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror.workspace = true
serde.workspace = true
# Voz (LiveKit + libwebrtc). Opcional: exige clang 21+ para compilar.
livekit = { version = "0.11", features = ["rustls-tls-webpki-roots"], optional = true }
tokio.workspace = true
futures-util.workspace = true

[features]
voice = ["dep:livekit"]

[[example]]
name = "voice_poc"
required-features = ["voice"]

[dev-dependencies]
anyhow.workspace = true
